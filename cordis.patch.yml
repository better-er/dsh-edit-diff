# dsh-edit-diff bundle patch：把 edit/write 的 diff 卡片插件插进 profile 的 layer stack。
# profile 引用本 bundle 时自动挂载。
# 浏览器半身由 dsh.client 声明自动发现，注册 tool.call.toolview 的 edit、write 与 extraTools 里的每个工具名，替换内置 DiffBlock。
# 主机端半身把 entry 配置注册成 settings 命名空间 dsh-edit-diff，浏览器端只能从这里拿到配置。
# 下面的默认顺带接管两个远程文件工具，参数名与原生一致，按 id 覆盖 extraTools 即可改。
- insert:
    - id: dsh-edit-diff
      name: dsh-edit-diff
      config:
        extraTools:
          - name: edit_remote
          - name: write_remote